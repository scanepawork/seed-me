name: "CI"
on:
  push:
    branches:
      - '[4-9]+.[0-9]+.x'
      - 'grails7'
      - 'master'
      - 'dev-*'
  pull_request:
jobs:
  build:
    name: 'Build'
    strategy:
      fail-fast: false
      matrix:
        java: [ 17 ]
        os: [ ubuntu-latest ]
    runs-on: ubuntu-24.04
    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4
      - name: "☕️ Setup JDK"
        uses: actions/setup-java@v4
        with:
          distribution: liberica
          java-version: ${{ matrix.java }}
      - name: "🐘 Setup Gradle"
        uses: gradle/actions/setup-gradle@v4
      - name: "🔨 Build project"
        run: >
          ./gradlew build
          --continue --stacktrace
  publish:
    needs: [ build ]
    if: github.repository_owner == 'wondrify' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4
      - name: "☕️ Setup JDK"
        uses: actions/setup-java@v4
        with:
          distribution: liberica
          java-version: 17
      - name: "🐘 Setup Gradle"
        uses: gradle/actions/setup-gradle@v4
      - name: "📤 Publish Snapshot"
        run: >
          ./gradlew publish
        env:
          GRAILS_PUBLISH_RELEASE: 'false'
          MAVEN_PUBLISH_URL: 'https://central.sonatype.com/repository/maven-snapshots/'
          MAVEN_PUBLISH_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PUBLISH_PASSWORD: ${{ secrets.MAVEN_PASSWORD  }}
  publish-github-packages:
    name: 'Publish to GitHub Packages'
    needs: [ build ]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4
      - name: "☕️ Setup JDK"
        uses: actions/setup-java@v4
        with:
          distribution: liberica
          java-version: 17
      - name: "🐘 Setup Gradle"
        uses: gradle/actions/setup-gradle@v4
      - name: "📦 Publish to GitHub Packages"
        run: >
          ./gradlew publishAllPublicationsToGitHubPackagesRepository
        env:
          GRAILS_PUBLISH_RELEASE: 'false'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GPR_PUBLISH_URL: https://maven.pkg.github.com/${{ github.repository }}
